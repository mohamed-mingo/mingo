<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>Mingo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c518;--ink:#eef0ff;--mute:#a9aed6;--pane:#12153acc;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Cairo,system-ui,sans-serif;color:var(--ink);background:#080a1f;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1}
header{direction:ltr;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:12px}
h1{margin:0;text-align:center;font-size:2rem;font-weight:900;color:var(--gold);cursor:pointer}
.ib{width:44px;height:44px;border:0;border-radius:50%;color:#fff;font-size:20px;cursor:pointer}
#pf{background:#8c8c96}#sr{background:#d6245c}
#mn{position:fixed;left:0;top:45%;z-index:6;width:34px;height:76px;border:0;border-radius:0 14px 14px 0;background:#1e6fe0;color:#fff;font-size:20px;cursor:pointer}
#st{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;background:#16161c;border:1px solid #3a3a48}
#sb{display:none;padding:0 14px 8px;max-width:600px;margin:auto}#sb.on{display:block}
#qi{width:100%;padding:12px 16px;border-radius:24px;border:1px solid #d6245c;background:#0d1030;color:var(--ink);font:inherit}
main{padding:8px 14px 90px;max-width:1100px;margin:auto}
h2{font-size:1.25rem;margin:18px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.c{background:var(--pane);border-radius:14px;overflow:hidden;cursor:pointer;text-align:start;border:0;color:inherit;font:inherit;padding:0}
.p{aspect-ratio:2/3;display:grid;place-items:center;font-size:3.4rem;font-weight:900;color:#fff9;position:relative;overflow:hidden}.p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c b{display:block;padding:8px 10px 0;font-size:.95rem}
.c small{display:block;padding:0 10px 10px;color:var(--mute)}
.tl{min-height:190px;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;font-weight:700;font-size:1.25rem;padding:20px 10px}.tl span{font-size:3.4rem}
button:focus-visible,input:focus-visible,h1:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#dr{position:fixed;left:0;top:0;bottom:0;width:240px;background:#0c0f2ef2;transform:translateX(-100%);transition:transform .25s;z-index:8;padding:60px 14px}
#dr.on{transform:none}
.nv{display:block;width:100%;margin:0 0 6px;padding:12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.nv.on{background:#1e6fe0}
#md{position:fixed;inset:0;background:#000a;z-index:9;display:none;align-items:center;justify-content:center;padding:14px}
#md.on{display:flex}
#bx{background:#12153a;border-radius:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:18px}
#bx h3,#bx h4{margin:.4em 0}#bx p{margin:.4em 0}
input[type=text],textarea,select{width:100%;padding:10px 14px;border-radius:12px;border:1px solid #4a4f8a;background:#0d1030;color:var(--ink);font:inherit}
select{width:auto}
.b{padding:8px 14px;border-radius:20px;border:1px solid #4a4f8a;background:#1b1f52;color:var(--ink);font:inherit;cursor:pointer;margin:2px;display:inline-block}
.b.on{background:var(--gold);color:#111;border-color:var(--gold)}
.mt{color:var(--mute);font-size:.85rem}
.row{background:var(--pane);border-radius:14px;padding:14px;margin-bottom:12px}
.cv{height:140px;border-radius:14px;padding:10px;margin-bottom:-42px}
.av{width:84px;height:84px;border-radius:50%;background:#8c8c96;border:3px solid #080a1f;display:grid;place-items:center;font-size:2rem;font-weight:900;position:relative;margin-inline-start:16px}
.hs{display:flex;gap:6px;align-items:flex-end;height:150px}
.hs div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.hs i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.duel .b{margin:0 10px 10px}.fbp{font-size:1.3rem}#fx{font-size:1.2rem}
@media(prefers-reduced-motion:reduce){#dr{transition:none}}
</style></head><body>

else if(pg=='set')h=`<h2>${t(6)}</h2><div class="row"><b>${t(7)}</b><p>${[['ar','العربية'],['en','English'],['es','Español']].map(a=>`<button class="b${S.lang==a[0]?' on':''}" onclick="S.lang='${a[0]}';save();ui()">${a[1]}</button>`).join('')}</p></div><div class="row"><b>${t(8)}</b><p>${GB.map((_,i)=>`<button class="b${!S.img&&S.bg==i?' on':''}" onclick="S.bg=${i};S.img='';save();ui()">${i+1}</button>`).join('')}<label class="b">${t(21)}<input type="file" accept="image/*" hidden onchange="up(this,'img')"></label></p></div><div class="row"><button class="b" onclick="out()">${t(9)}</button></div>`;
else if(pg=='prof'){const R=Object.keys(S.rt).map(byId).filter(d=>!pf||d.s==pf),cn=Array.from({length:10},(_,i)=>R.filter(d=>S.rt[d.id]==i+1).length),mx=Math.max(1,...cn);
h=`<div class="cv" style="background:${S.cov?`center/cover url('${S.cov}')`:'linear-gradient(120deg,#22307d,#7a45b0)'}"><label class="b">${t(39)}<input type="file" accept="image/*" hidden onchange="up(this,'cov')"></label></div><div class="av" style="${S.pic?`background:center/cover url('${S.pic}')`:''}">${S.pic?'':e(S.user[0]||'?')}</div><label class="b">${t(21)}<input type="file" accept="image/*" hidden onchange="up(this,'pic')"></label><h2>${e(S.user)}</h2><h3>${t(29)}</h3><p><select onchange="pf=this.value;r()"><option value="">${t(30)}</option>${SK.slice(0,7).map(k=>`<option value="${k}"${pf==k?' selected':''}>${t(LB[k])}</option>`).join('')}</select></p><div class="hs">${cn.map((n,i)=>`<div><i style="height:${n/mx*120}px"></i><span>${i+1}</span></div>`).join('')}</div><p>${t(40)}: ${R.length}</p><h3>${t(18)}</h3>${lk(S.fv)}<h3>${t(19)}</h3>${lk(S.wl)}`}
h+=`<p class="mt">${t(41)}</p>`;$('#mi').innerHTML=h}
function nav(){$('#dr').innerHTML=[['home',0],['sec',1],['tr',2],['fb',3]].map(a=>`<button class="nv${pg==a[0]||(a[0]=='tr'&&(pg=='cup'||pg=='champ'))?' on':''}" onclick="go('${a[0]}')">${t(a[1])}</button>`).join('')}
function go(p){if(p=='prof'&&!S.user)return welcome();pg=p;q='';$('#qi').value='';$('#dr').classList.remove('on');r();nav()}
const op=k=>{sc=k;pg='list';r()};
function ui(){const h=document.documentElement;h.lang=S.lang;h.dir=S.lang=='ar'?'rtl':'ltr';
$('#bg').style.background=S.img?`linear-gradient(#0007,#0007),url('${S.img}') center/cover`:GB[S.bg];
[['sr',4],['pf',5],['st',6],['mn',1]].forEach(a=>$('#'+a[0]).setAttribute('aria-label',t(a[1])));
$('#qi').placeholder=t(4);nav();r()}
const box=h=>{$('#bx').innerHTML=`<button class="b" style="float:inline-end" onclick="cl()" aria-label="Close">×</button>`+h;$('#md').classList.add('on')};
const cl=()=>$('#md').classList.remove('on');
function show(id){const d=byId(id),m=S.rt[id]||0;
box(`<h3>${e(nm(d))} <small>${d.y}</small></h3><p>${t(LB[d.s])}  ★ ${f(av(d))}</p><h4>${t(15)}</h4>${d.c.map(c=>`<p><b>${e(c[0])}</b>  ${e(c[1])}</p>`).join('')}`+
(S.user?`<h4>${t(16)}</h4><div>${Array.from({length:10},(_,i)=>`<button class="b${m==i+1?' on':''}" onclick="rate(${id},${i+1})">${i+1}</button>`).join('')}</div><p><button class="b${S.fv.includes(id)?' on':''}" onclick="tg('fv',${id})">♥ ${t(18)}</button><button class="b${S.wl.includes(id)?' on':''}" onclick="tg('wl',${id})">+ ${t(19)}</button></p>`
:`<p>${t(17)}</p><button class="b" onclick="welcome()">${t(11)}</button>`))}
const rate=(id,v)=>{S.rt[id]=v;save();show(id);r()};
const tg=(k,id)=>{const a=S[k],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();show(id);r()};
function welcome(){box(`<h3>${t(13)}</h3><input type="text" id="ni" maxlength="30" placeholder="${t(12)}"><p><button class="b on" onclick="li()">${t(11)}</button><button class="b" onclick="cl()">${t(10)}</button></p>`)}
const li=()=>{const v=$('#ni').value.trim();if(v){S.user=v;save();cl();r()}};
const out=()=>{S.user='';save();pg='home';r();nav();welcome()};
function vote(k){if(!S.user)return welcome();S.pts[k]=(S.pts[k]||0)+1;save();r()}
function sendFb(){const v=$('#fx').value.trim();if(!v)return;S.fb.push(v);save();$('#fx').value='';box(`<p>${t(38)}</p>`)}
function up(inp,k){const fl=inp.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{S[k]=rd.result;save();ui()};rd.readAsDataURL(fl)}
document.addEventListener('keydown',ev=>{if(ev.key=='Escape')cl();if(ev.key=='Enter'&&ev.target.id=='ti')go('home')});
$('#md').onclick=ev=>{if(ev.target.id=='md')cl()};
ui();if(!S.user)welcome();
</script></body></html>
